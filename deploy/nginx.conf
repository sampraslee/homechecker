# Home Check on a VPS with nginx. HTTPS is required: the camera, microphone and service worker
# only work on a secure page. Replace the address, root and certificate paths; see docs/deploy.md.
server {
    listen 80;
    server_name home-check.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on; # nginx older than 1.25.1: drop this line and use "listen 443 ssl http2;"
    server_name home-check.example.com;

    ssl_certificate     /etc/letsencrypt/live/home-check.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home-check.example.com/privkey.pem;

    root /var/www/home-check;
    index index.html;

    # Older mime.types files don't know the web app manifest. An empty types block here only
    # affects this location; in the server block it would drop every other type.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Hashed file names, so they never change: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else (index.html, sw.js, the manifest) must be checked on every load,
    # or phones keep running an old version of the app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
